<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電路學學習歷程</title>
  
  <!-- 防止 favicon 404 警告 -->
  <link rel="icon" href="data:,">

  <!-- 引入外部 CSS 樣式表 -->
  <link rel="stylesheet" href="style.css">

  <!-- 配置並引入 MathJax -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script" async></script>
</head>
<body>

  <!-- 左側邊欄 -->
  <div class="sidebar">
    <div>
      <div class="sidebar-header">電路學學習歷程</div>
      <div class="sidebar-actions">
        <button class="btn btn-secondary btn-sm" onclick="openModal('addChapterModal')">➕ 新增章節</button>
        <button class="btn btn-secondary btn-sm" onclick="openModal('addProblemModal')">➕ 手動新增題目</button>
      </div>
      <ul class="chapter-list" id="chapterList"></ul>
    </div>
    <div>
      <button class="btn btn-secondary" style="width: 100%; margin-bottom: 8px;" onclick="openModal('configModal')">⚙️ API / GitHub 設定</button>
      <button class="btn btn-primary" style="width: 100%;" onclick="openModal('aiSolveModal')">📷 上傳題目圖檔 (AI 解題)</button>
    </div>
  </div>

  <!-- 主內容區 -->
  <div class="main-content">
    <div class="top-bar">
      <h2 id="currentChapterTitle">請選擇章節</h2>
      <div class="top-actions">
        <button class="btn btn-success" id="ghSyncBtn" onclick="syncToGitHub()">☁️ 一鍵同步至 GitHub</button>
        <button class="btn btn-secondary" onclick="exportData()">📥 匯出 JSON</button>
        <button class="btn btn-secondary" onclick="document.getElementById('importFileInput').click()">📤 匯入 JSON</button>
        <input type="file" id="importFileInput" accept=".json" style="display: none;" onchange="importData(event)">
      </div>
    </div>
    <div class="content-area" id="problemList"></div>
  </div>

  <!-- Modal: 新增章節 -->
  <div class="modal" id="addChapterModal">
    <div class="modal-content">
      <h3>➕ 新增章節</h3>
      <br>
      <form onsubmit="event.preventDefault(); createChapter();">
        <div class="form-group">
          <label>章節 ID (格式如: ch4)</label>
          <input type="text" id="newChId" placeholder="例如：ch4" required>
        </div>
        <div class="form-group">
          <label>章節名稱 (title)</label>
          <input type="text" id="newChTitle" placeholder="例如：第四章 AC 電路分析" required>
        </div>
        <div class="form-group">
          <label>章節描述 (desc)</label>
          <input type="text" id="newChDesc" placeholder="例如：正弦穩態分析">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">確定新增章節</button>
        <button type="button" class="btn btn-secondary" onclick="closeModal('addChapterModal')" style="margin-top: 8px; width: 100%;">取消</button>
      </form>
    </div>
  </div>

  <!-- Modal: 手動新增題目 -->
  <div class="modal" id="addProblemModal">
    <div class="modal-content">
      <h3>➕ 手動新增題目</h3>
      <br>
      <form onsubmit="event.preventDefault(); createProblem();">
        <div class="form-group">
          <label>歸類章節</label>
          <select id="addProblemChapterSelect" required></select>
        </div>
        <div class="form-group">
          <label>題號 (num)</label>
          <input type="text" id="newProbNum" placeholder="例如：2-15" required>
        </div>
        <div class="form-group">
          <label>主題 (topic)</label>
          <input type="text" id="newProbTopic" placeholder="例如：戴維寧等效電路分析" required>
        </div>
        <div class="form-group">
          <label>題目內容 (question，支援 LaTeX 化學/數學公式，如 $v(t)$)</label>
          <textarea id="newProbQuestion" rows="3" class="form-control" placeholder="請輸入題目內容" required></textarea>
        </div>
        <div class="form-group">
          <label>解答內容 (solution，支援 HTML 標籤及 $$ 公式)</label>
          <textarea id="newProbSolution" rows="4" class="form-control" placeholder="<ol><li><b>步驟一：</b>求等效電阻 $$R_{th} = 10\Omega$$</li></ol>" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">確定新增題目</button>
        <button type="button" class="btn btn-secondary" onclick="closeModal('addProblemModal')" style="margin-top: 8px; width: 100%;">取消</button>
      </form>
    </div>
  </div>

  <!-- Modal: AI 上傳解題 -->
  <div class="modal" id="aiSolveModal">
    <div class="modal-content">
      <h3>📷 上傳題目圖檔 (AI 解題)</h3>
      <br>
      <div class="form-group">
        <label>歸類章節</label>
        <select id="aiChapterSelect"></select>
      </div>
      <div class="form-group">
        <label>選擇題目圖片 (支援 PNG/JPG)</label>
        <input type="file" id="aiImageInput" accept="image/*" onchange="previewAiImage(event)">
      </div>
      <div id="aiImagePreviewContainer" style="display: none; margin-bottom: 12px; text-align: center;">
        <img id="aiImagePreview" src="" alt="預覽" style="max-width: 100%; max-height: 180px; border-radius: 6px;">
      </div>
      <div class="form-group">
        <label>補充 Prompt 說明 (可留空)</label>
        <input type="text" id="aiPromptInput" placeholder="例如：解析 3-10 或重點補充">
      </div>

      <button class="btn btn-primary" id="aiSolveBtn" onclick="runAiAnalysis()" style="width: 100%;">
        ✨ AI 正在解析與推導解答
      </button>

      <div id="aiProgressWrapper" style="display: none;">
        <div class="progress-container">
          <div class="progress-bar"></div>
        </div>
        <div class="progress-text" id="aiProgressStatus">🤖 AI 正在分析影像與推導公式，請稍候...</div>
      </div>

      <button class="btn btn-secondary" id="aiCancelBtn" onclick="cancelAiAnalysis()" style="margin-top: 8px; width: 100%;">取消</button>
    </div>
  </div>

  <!-- Modal: API 與 GitHub 金鑰設定 -->
  <div class="modal" id="configModal">
    <div class="modal-content">
      <h3>⚙️ API 與 GitHub 同步設定</h3>
      <br>
      <form onsubmit="return false;">
        <div class="form-group">
          <label>Gemini API Key</label>
          <input type="password" id="cfgGeminiKey" placeholder="AIzaSy..." autocomplete="current-password">
        </div>
        <hr style="margin: 16px 0; border: none; border-top: 1px dashed var(--border-color);">
        <div class="form-group">
          <label>GitHub Personal Access Token (PAT)</label>
          <input type="password" id="cfgGithubToken" placeholder="ghp_..." autocomplete="current-password">
        </div>
        <div class="form-group">
          <label>GitHub 用戶名 / 儲存庫 (Repo)</label>
          <input type="text" id="cfgGithubRepo" placeholder="your-username/your-repo">
        </div>
        <div class="form-group">
          <label>GitHub 目標檔案路徑</label>
          <input type="text" id="cfgGithubPath" placeholder="data.json" value="data.json">
        </div>
        <button class="btn btn-primary" onclick="saveConfig()" style="width: 100%;">儲存設定</button>
        <button class="btn btn-secondary" onclick="closeModal('configModal')" style="margin-top: 8px; width: 100%;">取消</button>
      </form>
    </div>
  </div>

  <!-- 引入外部 JavaScript 邏輯 -->
  <script src="script.js"></script>
</body>
</html>
